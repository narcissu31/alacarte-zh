# 是否关闭上游压缩：关掉才能用 sub_filter 改写 HTML，请勿删除
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;

  # 语言包本体（由 compose 挂载进来）
  location = /zh.js {
    root /usr/share/nginx/zh;
    add_header Cache-Control "no-store";
    access_log off;
  }

  location / {
    proxy_pass http://alacarte-web:7373;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    # 关键：禁用上游压缩，否则响应体是 gzip，sub_filter 无法改写
    proxy_set_header Accept-Encoding "";

    # 在 </body> 前注入语言包脚本（只注入一次）
    sub_filter '</body>' '<script src="/zh.js" defer></script></body>';
    sub_filter_once on;
    sub_filter_types text/html;

    # SSE / 长连接（任务进度实时推送）不要缓冲
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }
}
